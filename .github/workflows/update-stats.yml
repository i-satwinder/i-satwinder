name: Metrics
on:
  # Schedule daily updates at midnight
  schedule: [{cron: "0 0 * * *"}]
  # (Optional) Run workflow manually from the Actions tab
  workflow_dispatch:
  # (Optional) Run on push to main branch
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📊 General Stats and Top Languages
        uses: lowlighter/metrics@latest
        with:
          # Your Classic PAT (stored in Secrets)
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: UTC

          # 1. Profile Stats (included in base above)
          
          # 2. Top Languages plugin
          plugin_languages: yes
          plugin_languages_ignored: html, css       # Optional: ignore simple languages
          plugin_languages_details: percentage, lines # Show % and lines of code
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
